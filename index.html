<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferienjob Plattform</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="logo-top-right">
      <div class="hj-logo">

        <div class="orbit orbit-glow"></div>
        <div class="orbit orbit-line"></div>

        <div class="text holiday">HOLIDAY</div>
        <div class="connector"></div>
        <div class="text job">JOB</div>

      </div>
    </div>

    <h1>Ferienjob Plattform</h1>

    <div class="page-intro">
        <p>Hier können Unternehmen Ferienjobs veröffentlichen und Jugendliche passende Jobs in ihrer Umgebung finden.</p>
    </div>

    <!-- ========================= -->
    <!-- FORMULAR: JOB ERSTELLEN -->
    <!-- ========================= -->
    <section class="post-job-section">
        <button type="button" id="job-form-toggle" class="job-form-toggle">
            <span>Ferienjob posten</span>
            <span id="job-form-toggle-icon" class="job-form-toggle-icon">+</span>
        </button>
    
        <div id="job-form-wrapper" class="job-form-wrapper">
            <div id="job-message" class="message-box hidden"></div>
            <form id="job-form">
                <input type="text" id="company" placeholder="Firma" required>
                <input type="text" id="title" placeholder="Jobtitel" required>
    
                <select id="category">
                    <option value="">Kategorie auswählen</option>
                    <option value="Gastronomie">Gastronomie</option>
                    <option value="Büro">Büro</option>
                    <option value="Bau">Bau</option>
                    <option value="Verkauf">Verkauf</option>
                    <option value="Sonstiges">Sonstiges</option>
                </select>
    
                <input type="text" id="location" placeholder="Ort / PLZ" required>
                <input type="text" id="contact" placeholder="Kontakt" required>
                <input type="text" id="salary" placeholder="Lohn (optional)">
                <input type="text" id="requirements" placeholder="Anforderungen (optional)">
                <input type="text" id="duration" placeholder="Zeitdauer">
    
                <textarea id="description" placeholder="Beschreibung" required></textarea>
    
                <input type="text" id="website" class="honeypot-field" tabindex="-1" autocomplete="off">
    
                <button type="submit">Job veröffentlichen</button>
            </form>
        </div>
    </section>

    <!-- ========================= -->
    <!-- SUCHE -->
    <!-- ========================= -->
    <section class="filter-section">
        <button type="button" id="filter-toggle" class="filter-toggle">
            <span>Ferienjob finden</span>
            <span class="filter-icon">🔍</span>
        </button>
    
        <div id="filter-wrapper" class="filter-wrapper">
            <div class="search-filters">
                <input type="text" id="search-location" placeholder="Ort / PLZ">
                <input type="number" id="search-min-salary" placeholder="Mindestlohn">
                
                <select id="search-category">
                    <option value="">Alle Kategorien</option>
                    <option value="Gastronomie">Gastronomie</option>
                    <option value="Büro">Büro</option>
                    <option value="Bau">Bau</option>
                    <option value="Verkauf">Verkauf</option>
                    <option value="Sonstiges">Sonstiges</option>
                </select>
    
                <input type="text" id="search-duration" placeholder="Zeitraum (TT.MM.JJJJ - TT.MM.JJJJ)">
            </div>
    
            <div class="search-actions">
                <button type="button" id="apply-filters">Filter anwenden</button>
                <button type="button" id="reset-filters" class="secondary-button">Zurücksetzen</button>
            </div>
    
            <p class="notice">
                Finde deinen perfekten Ferienjob.
            </p>
            
        </div>
    </section>
    
    <!-- ========================= -->
    <!-- JOB LISTE -->
    <!-- ========================= -->
    <section>
        <h2>Alle Ferienjobs</h2>

        <div id="job-list">
            <!-- Hier werden später die Jobs angezeigt -->
        </div>
    </section>

    <!-- ========================= -->
    <!-- SCRIPT UND DIV FÜR AUSBLENDEN -->
    <!-- ========================= -->
    
<div id="loading-overlay" class="loading-overlay hidden">
    <div class="loading-box">
        <div class="spinner"></div>
        <p>Job wird veröffentlicht...</p>
    </div>
</div>
    
    <script src="api.js"></script>
    <script src="app.js"></script>

</body>
</html>
