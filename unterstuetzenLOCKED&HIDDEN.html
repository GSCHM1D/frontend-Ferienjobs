<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unterstütze holidayjob.ch</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Unterstütze holidayjob.ch</h1>
    <div class="page-intro">Hier können Sie unser Projket finanziell unterstützen. Wir freuen uns über jede Hilfe!</div>
    <section class="account-transfer-informations">
        <h2>Kontöberweisung</h2>
        <p>IBAN:</p>
        <p>BIC:</p>
    </section>
    <section class="stripe-link">
        <h2>Kartenzahlung</h2>
        <p>Stripe Link</p>
    </section>
    <section class="become-sponsor">
        <h3>Auf der Webseite als Sponsor genannt werden?</h3>
        <div class="sponsor-form">
            <input type="text" id="company-name" placeholder="Name des Unternehmens" required>
            <input type="file" id="company-logo" placeholder="Logo des Unternehmens (optional)">
        </div>
    </section>
</body>
